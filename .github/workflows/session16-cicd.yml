# Session 16 – CI/CD demo pipeline for "Assignment/GitHub Actions"
#
#   test ──┬── build (artifact)
#          └── security-check ──┐
#   test ───────────────────────┴── docker (build, smoke test, push to GHCR)
#                                       └── deploy (CD to a Kubernetes kind cluster)
name: Session 16 CI/CD

on:
  push:
    branches: [Assignment]
    paths:
      - "Assignment/GitHub Actions/**"
      - ".github/workflows/session16-cicd.yml"
  pull_request:
    branches: [Assignment]
    paths:
      - "Assignment/GitHub Actions/**"
  workflow_dispatch:

env:
  APP_DIR: Assignment/GitHub Actions
  IMAGE_NAME: session16-calculator

defaults:
  run:
    working-directory: Assignment/GitHub Actions

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/test-results.xml

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check for sensitive files
        run: |
          echo "Checking for committed secrets files (.env, *.pem, *.key)..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep .; then
            echo "::error::Sensitive file found in the repository"
            exit 1
          fi
          echo "No common sensitive files found."

      - name: Use a secret safely
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          if [ -n "$APP_SECRET" ]; then
            echo "APP_SECRET is configured (value is masked in logs): $APP_SECRET"
          else
            echo "APP_SECRET is not configured - optional for this demo"
          fi

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build output
        run: cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: ${{ env.APP_DIR }}/build/

  docker:
    name: Docker Build & Push
    needs: [test, security-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set image name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build --build-arg APP_VERSION=$TAG -t $IMAGE:$TAG -t $IMAGE:latest .
          docker images $IMAGE

      - name: Smoke test the container
        run: |
          docker run -d --name calc -p 8080:8080 $IMAGE:$TAG
          for i in $(seq 1 15); do curl -fs localhost:8080/health && break; sleep 1; done
          echo
          curl -fs "localhost:8080/api/add?a=10&b=5"; echo
          curl -fs "localhost:8080/api/multiply?a=6&b=7"; echo
          docker logs calc
          docker rm -f calc

      - name: Save image as artifact
        run: docker save $IMAGE:$TAG -o /tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: [docker, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cicd-demo

      - name: Load image into the cluster
        run: |
          IMAGE_REF=$(docker load -i /tmp/image.tar | sed -n 's/^Loaded image: //p')
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          kind load docker-image "$IMAGE_REF" --name cicd-demo

      - name: Deploy manifests
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE_REF|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/calculator --timeout=120s
          kubectl get deploy,pods,svc -o wide

      - name: Verify deployment
        run: |
          kubectl port-forward svc/calculator 8080:80 &
          sleep 3
          curl -fs localhost:8080/health; echo
          curl -fs "localhost:8080/api/subtract?a=100&b=58"; echo
          echo "Deployed $IMAGE_REF successfully"
