# Applied once from the admin side (kubectl apply); kept outside app/ so Argo CD does not manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Yashukiran/devops-heros.git
    targetRevision: Assignment
    path: Assignment/Monitoring Observability GitOps/gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: session20

  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from Git
      selfHeal: true   # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
