name: session21

services:
  backend:
    build: ./app/backend
    image: session21/task-tracker-api:1.0.0
    container_name: session21-backend
    environment:
      APP_VERSION: "1.0.0"
      ENVIRONMENT: docker-compose
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    image: session21/task-tracker-ui:1.0.0
    container_name: session21-frontend
    environment:
      BACKEND_HOST: backend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: session21-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped
