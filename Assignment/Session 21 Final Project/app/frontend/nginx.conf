# served by nginx-unprivileged (non-root, port 8080)
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # same-origin calls from the browser are proxied to the backend service
    location /api/info { proxy_pass http://${BACKEND_HOST}:8000/; }
    location /api/     { proxy_pass http://${BACKEND_HOST}:8000; }
    location = /health { proxy_pass http://${BACKEND_HOST}:8000/health; }

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / { try_files $uri $uri/ /index.html; }
}
