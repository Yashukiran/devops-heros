apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "tt.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-backend }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-backend }
    spec:
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: APP_VERSION, value: {{ .Chart.AppVersion | quote }} }
            - { name: ENVIRONMENT, value: {{ .Values.environment | quote }} }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, initialDelaySeconds: 5 }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "tt.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {{- include "tt.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-backend
spec:
  selector: { app: {{ .Release.Name }}-backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-backend }
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    matchLabels: { app: {{ .Release.Name }}-backend }
  endpoints: [{ port: http, path: /metrics, interval: 15s }]
{{- end }}
