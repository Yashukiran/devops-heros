apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "tt.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-frontend }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-frontend }
    spec:
      containers:
        - name: ui
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: BACKEND_HOST, value: backend }
          readinessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /nginx-health, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "tt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector: { app: {{ .Release.Name }}-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
